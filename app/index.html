<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app</title>
  </head>
  <body>
    <main id="app">
  <section id="input">
  <h1>FormCheck</h1>
  <p>Choose a side-view video of a squat set.</p>
  <input type="file" id="file" accept="video/*" />
  <button type="button" id="analyze">Analyze</button>
  </section>

  <section id="analyzing">
  <p id="progress-text"></p>
  </section>

  <div class="player">
  <video id="video" controls playsinline muted></video>
  <canvas id="overlay"></canvas>
  </div>

  <section id="results" hidden>
  <p id="summary"></p>
  <ol id="rep-list"></ol>
  </section>
  
  </section>
</main>
 <script type="module" src="/src/main.ts"></script>
  </body>
</html>
